name: Android build

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 platform
        run: yes | sdkmanager --licenses >/dev/null || true
             sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APKs
        run: ./gradlew :host:assembleDebug :client:assembleDebug

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: darki-dex-debug-apks
          path: |
            host/build/outputs/apk/debug/*.apk
            client/build/outputs/apk/debug/*.apk
